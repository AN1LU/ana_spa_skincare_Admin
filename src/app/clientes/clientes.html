<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<div class="espacio-vacio">
  <app-add-client></app-add-client>
  <button class="boton-csv" (click)="descargarCSV()">
    <i class="fa-solid fa-download"></i>
    Reporte CSV
  </button>
</div>

<table>
  <tr>
    <th>Nombre</th>
    <th>Fecha de Nacimiento</th>
    <th>Tipo de piel</th>
    <th>Tratamientos</th>
    <th>Teléfono</th>
    <th>Acciones</th>
  </tr>
  <tr *ngFor="let cliente of clientes">
    <td>{{cliente.nombre}}</td>
    <td>{{cliente.fecha_nacimiento}}</td>
    <td>{{cliente.piel_tipo}}</td>
    <td>{{cliente.tratamientos}}</td>
    <td>{{cliente.telefono}}</td>
    <td>
      <app-delete-client [idCliente]="cliente.id"></app-delete-client>
    </td>
  </tr>
</table>
