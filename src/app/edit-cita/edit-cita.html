<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<button class="btn-editar" (click)="abrirModal(cita)">
  <i class="fa fa-edit"></i>
</button>

<div class="modal" [class.show]="mostrarModal">
  <div class="modal-content">
    <span class="cerrar" (click)="cerrarModal()">&times;</span>
    <h2>Editar Cita</h2>
    <form (ngSubmit)="guardarCambios()">
      <label>Fecha de la cita:</label>
      <input type="date" [(ngModel)]="cita_fecha" name="cita_fecha" required />
      <label>Hora:</label>
      <input type="time" [(ngModel)]="hora" name="hora" required />
      <label>Cliente:</label>
      <select [(ngModel)]="id_cliente" name="id_cliente" required>
        <option value="" disabled>Selecciona cliente</option>
        <option *ngFor="let cliente of clientes" [value]="cliente.id">
          {{ cliente.nombre }}
        </option>
      </select>
      <label>Servicio:</label>
      <select [(ngModel)]="id_serviciocita" name="id_serviciocita" required>
        <option value="" disabled>Selecciona servicio</option>
        <option *ngFor="let servicio of servicios" [value]="servicio.id_servicio">
          {{ servicio.nombre }}
        </option>
      </select>
      <label>Mensaje (opcional):</label>
      <textarea [(ngModel)]="mensaje" name="mensaje" rows="3" placeholder="Detalles o comentarios sobre la cita..."></textarea>
      <button class="btn-save" type="submit">Guardar Cambios</button>
    </form>
  </div>
</div>
